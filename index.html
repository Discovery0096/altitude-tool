<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070809">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="一个基于浏览器定位的极简海拔测量工具。">
<title>海拔 · Altitude</title>
<style>
  :root {
    --bg: #070809;
    --fg: #f4f7fa;
    --muted: #8a94a6;
    --accent: #5eead4;
    --danger: #ff6b6b;
    --warn: #ffd166;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html {
    height: 100%;
  }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    padding: calc(env(safe-area-inset-top) + 20px) 22px calc(env(safe-area-inset-bottom) + 22px);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    color: var(--fg);
    background-color: var(--bg);
    background-image:
      radial-gradient(120% 75% at 50% -8%, #18222d 0%, #0b0f14 46%, #070809 100%);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC",
      "Helvetica Neue", "Microsoft YaHei", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none;
    user-select: none;
  }

  /* ---------- 顶栏 ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex: none;
  }

  .brand {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #39424f;
    transition: background 0.3s ease, box-shadow 0.3s ease;
  }

  body[data-state="loading"] .dot {
    background: var(--accent);
    animation: pulse 1.1s ease-out infinite;
  }
  body[data-state="ok"] .dot {
    background: var(--accent);
    box-shadow: 0 0 0 5px rgba(94, 234, 212, 0.14);
  }
  body[data-state="warn"] .dot {
    background: var(--warn);
    box-shadow: 0 0 0 5px rgba(255, 209, 102, 0.14);
  }
  body[data-state="error"] .dot {
    background: var(--danger);
    box-shadow: 0 0 0 5px rgba(255, 107, 107, 0.14);
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(94, 234, 212, 0.5); }
    70%  { box-shadow: 0 0 0 10px rgba(94, 234, 212, 0); }
    100% { box-shadow: 0 0 0 0 rgba(94, 234, 212, 0); }
  }

  /* ---------- 主读数 ---------- */
  main {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
  }

  .readout {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 0.04em;
    line-height: 1;
  }

  .value {
    display: inline-block;
    font-size: clamp(92px, 33vw, 250px);
    font-weight: 800;
    line-height: 0.86;
    letter-spacing: -0.055em;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
    background-image: linear-gradient(180deg, #ffffff 0%, #c3cfdb 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    transition: opacity 0.3s ease;
  }

  body[data-state="loading"] .value,
  body[data-state="error"] .value {
    opacity: 0.45;
  }

  .value.pop {
    animation: pop 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  @keyframes pop {
    from { transform: translateY(8px) scale(0.96); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }

  .unit {
    font-size: clamp(22px, 6.5vw, 46px);
    font-weight: 600;
    letter-spacing: 0;
    color: var(--muted);
    transition: opacity 0.25s ease;
  }

  .unit.is-hidden {
    opacity: 0;
  }

  .status {
    margin: 0;
    max-width: 20em;
    min-height: 3em;
    font-size: 15px;
    line-height: 1.6;
    color: var(--muted);
  }

  body[data-state="error"] .status {
    color: #ffb3b3;
  }
  body[data-state="warn"] .status {
    color: #ffe0a3;
  }

  /* ---------- 底部操作区 ---------- */
  .bottom {
    flex: none;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .meta {
    margin: 0;
    min-height: 1.3em;
    font-size: 12.5px;
    line-height: 1.7;
    text-align: center;
    color: #6f7a8b;
    font-variant-numeric: tabular-nums;
    transition: opacity 0.3s ease;
  }

  button {
    width: 100%;
    padding: 19px 24px;
    border: 0;
    border-radius: 20px;
    font-family: inherit;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: #04120f;
    background-image: linear-gradient(180deg, #7ff0dd 0%, #40d7bd 100%);
    box-shadow:
      0 14px 34px -14px rgba(94, 234, 212, 0.65),
      inset 0 1px 0 rgba(255, 255, 255, 0.45);
    cursor: pointer;
    transition: transform 0.16s ease, opacity 0.2s ease, filter 0.2s ease;
  }

  button:active {
    transform: scale(0.975);
  }

  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  button:disabled {
    opacity: 0.55;
    filter: saturate(0.5);
    cursor: default;
    transform: none;
  }

  /* ---------- 无障碍：减少动效 ---------- */
  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body data-state="idle">

  <div class="topbar">
    <span class="brand">Altitude</span>
    <span class="dot" id="dot" aria-hidden="true"></span>
  </div>

  <main>
    <div class="readout" aria-hidden="true">
      <span class="value" id="value">--</span>
      <span class="unit is-hidden" id="unit">m</span>
    </div>
    <p class="status" id="status" role="status" aria-live="polite">点击下方按钮，开始测量当前海拔</p>
  </main>

  <div class="bottom">
    <p class="meta" id="meta"></p>
    <button id="refresh" type="button">刷新海拔</button>
  </div>

  <noscript>
    <p style="position:fixed;inset:0;margin:0;display:grid;place-items:center;background:#070809;color:#f4f7fa;font-size:16px;">
      需要启用 JavaScript 才能使用海拔工具。
    </p>
  </noscript>

<script>
(function () {
  'use strict';

  var valueEl = document.getElementById('value');
  var unitEl = document.getElementById('unit');
  var statusEl = document.getElementById('status');
  var metaEl = document.getElementById('meta');
  var btn = document.getElementById('refresh');
  var body = document.body;

  var BUTTON_TEXT = '刷新海拔';
  var busy = false;

  // Geolocation 错误码：1 权限拒绝 / 2 位置不可用 / 3 超时
  var ERROR_MESSAGES = {
    1: '定位权限被拒绝。请到浏览器或系统设置中允许访问位置，然后重试。',
    2: '暂时无法获取位置信息，请检查网络或定位服务是否已开启。',
    3: '定位超时了，请到室外开阔处再试一次。'
  };

  function setState(state) {
    body.dataset.state = state;
  }

  function setReadout(text, showUnit) {
    valueEl.textContent = text;
    unitEl.classList.toggle('is-hidden', !showUnit);
  }

  function showError(message) {
    busy = false;
    btn.disabled = false;
    btn.textContent = BUTTON_TEXT;
    setState('error');
    setReadout('--', false);
    statusEl.textContent = message;
    metaEl.textContent = '';
  }

  function showSuccess(position) {
    var coords = position.coords;
    var altitude = coords.altitude;

    busy = false;
    btn.disabled = false;
    btn.textContent = BUTTON_TEXT;

    // 部分设备（尤其是未开启 GPS 的机型）不会返回垂直方向数据
    if (altitude === null || typeof altitude !== 'number' || isNaN(altitude)) {
      setState('warn');
      setReadout('--', false);
      statusEl.textContent = '已定位成功，但当前设备未能提供海拔数据。可在室外开阔处重试。';
    } else {
      setState('ok');
      setReadout(String(Math.round(altitude)), true);
      statusEl.textContent = '当前海拔';

      // 重新触发数字动画
      valueEl.classList.remove('pop');
      void valueEl.offsetWidth;
      valueEl.classList.add('pop');
    }

    var parts = [
      '纬度 ' + coords.latitude.toFixed(5),
      '经度 ' + coords.longitude.toFixed(5)
    ];

    if (typeof coords.accuracy === 'number') {
      parts.push('水平精度 ±' + Math.round(coords.accuracy) + ' m');
    }

    var time = new Date(position.timestamp).toLocaleTimeString('zh-CN', {
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      hour12: false
    });

    metaEl.textContent = parts.join(' · ') + ' · 更新于 ' + time;
  }

  function locate() {
    if (busy) {
      return;
    }

    if (!('geolocation' in navigator)) {
      showError('当前浏览器不支持定位功能，请更换浏览器后重试。');
      return;
    }

    busy = true;
    btn.disabled = true;
    btn.textContent = '定位中…';
    setState('loading');
    setReadout('--', false);
    statusEl.textContent = '正在定位...';
    metaEl.textContent = '';

    navigator.geolocation.getCurrentPosition(
      showSuccess,
      function (error) {
        showError(ERROR_MESSAGES[error.code] || '获取位置失败，请稍后重试。');
      },
      {
        enableHighAccuracy: true,
        timeout: 20000,
        maximumAge: 0
      }
    );
  }

  btn.addEventListener('click', locate);
})();
</script>
</body>
</html>
