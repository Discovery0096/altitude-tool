<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="一个基于浏览器定位的极简海拔测量工具。">
<title>海拔 · Altitude</title>
<style>
  /* 注册后数字渐变色才能随主题平滑过渡（不支持时自动降级为瞬时切换） */
  @property --num-top {
    syntax: "<color>";
    inherits: true;
    initial-value: #ffffff;
  }

  @property --num-bottom {
    syntax: "<color>";
    inherits: true;
    initial-value: #c3cfdb;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html,
  body {
    height: 100%;
  }

  body {
    /* 默认主题：深海蓝（海拔 < 500m） */
    --bg: #0f172a;
    --fg: #f4f7fa;
    --muted: #93a3b8;
    --dim: #7d8da3;
    --surface: rgba(255, 255, 255, 0.05);
    --edge: rgba(255, 255, 255, 0.09);
    --num-top: #ffffff;
    --num-bottom: #c3cfdb;
    --accent: #5eead4;
    --pulse: rgba(94, 234, 212, 0.45);
    --dot-idle: #39424f;
    --good-fg: #8af3df;
    --good-bg: rgba(94, 234, 212, 0.1);
    --good-edge: rgba(94, 234, 212, 0.24);
    --fair-fg: #ffe0a3;
    --fair-bg: rgba(255, 209, 102, 0.1);
    --fair-edge: rgba(255, 209, 102, 0.24);
    --weak-fg: #ffb9b9;
    --weak-bg: rgba(255, 107, 107, 0.12);
    --weak-edge: rgba(255, 107, 107, 0.28);
    --error-fg: #ffb3b3;
    --warn-fg: #ffe0a3;

    margin: 0;
    height: 100vh;
    height: 100dvh;
    padding: calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 18px);
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow: hidden;
    overscroll-behavior: none;
    color: var(--fg);
    background-color: var(--bg);
    background-image: radial-gradient(120% 70% at 50% -10%,
      rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0) 55%);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
      "Helvetica Neue", "Microsoft YaHei", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none;
    user-select: none;
    transition: background-color 0.9s ease, color 0.6s ease;
  }

  /* ---------- 海拔配色区间 ---------- */
  body[data-zone="forest"] {
    --bg: #064e3b;
    --muted: #a9d9c8;
    --dim: #90c2b1;
    --surface: rgba(255, 255, 255, 0.07);
    --edge: rgba(255, 255, 255, 0.13);
  }

  body[data-zone="rock"] {
    --bg: #334155;
    --muted: #c4d1e0;
    --dim: #a7b5c7;
    --surface: rgba(255, 255, 255, 0.07);
    --edge: rgba(255, 255, 255, 0.13);
  }

  body[data-zone="snow"] {
    --bg: #e2e8f0;
    --fg: #0b1220;
    --muted: #47566b;
    --dim: #5b6b80;
    --surface: rgba(15, 23, 42, 0.05);
    --edge: rgba(15, 23, 42, 0.13);
    --num-top: #0b1220;
    --num-bottom: #33415a;
    --accent: #0f766e;
    --pulse: rgba(15, 118, 110, 0.35);
    --dot-idle: #94a3b8;
    --good-fg: #0f766e;
    --good-bg: rgba(15, 118, 110, 0.12);
    --good-edge: rgba(15, 118, 110, 0.28);
    --fair-fg: #96590a;
    --fair-bg: rgba(180, 120, 20, 0.14);
    --fair-edge: rgba(180, 120, 20, 0.3);
    --weak-fg: #b91c1c;
    --weak-bg: rgba(185, 28, 28, 0.1);
    --weak-edge: rgba(185, 28, 28, 0.28);
    --error-fg: #b91c1c;
    --warn-fg: #96590a;
  }

  /* ---------- 顶栏 ---------- */
  .topbar {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand-wrap {
    display: flex;
    align-items: center;
    gap: 9px;
  }

  .brand {
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
    transition: color 0.6s ease;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--dot-idle);
    transition: background 0.3s ease, box-shadow 0.3s ease;
  }

  body[data-state="loading"] .dot {
    background: var(--accent);
    animation: pulse 1.1s ease-out infinite;
  }
  body[data-state="ok"] .dot {
    background: var(--accent);
    box-shadow: 0 0 0 5px var(--good-bg);
  }
  body[data-state="warn"] .dot {
    background: #ffd166;
    box-shadow: 0 0 0 5px var(--fair-bg);
  }
  body[data-state="error"] .dot {
    background: #ff6b6b;
    box-shadow: 0 0 0 5px var(--weak-bg);
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 var(--pulse); }
    70%  { box-shadow: 0 0 0 10px rgba(0, 0, 0, 0); }
    100% { box-shadow: 0 0 0 0 rgba(0, 0, 0, 0); }
  }

  /* ---------- 单位切换 ---------- */
  .segmented {
    position: relative;
    display: flex;
    padding: 3px;
    border-radius: 12px;
    background-color: var(--surface);
    border: 1px solid var(--edge);
    transition: background-color 0.6s ease, border-color 0.6s ease;
  }

  .seg-thumb {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 42px;
    height: 26px;
    border-radius: 9px;
    background-image: linear-gradient(180deg, #9df6e8 0%, #45dcc2 100%);
    box-shadow: 0 4px 10px -4px rgba(45, 212, 191, 0.55);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .segmented[data-active="ft"] .seg-thumb {
    transform: translateX(42px);
  }

  .seg {
    position: relative;
    z-index: 1;
    width: 42px;
    height: 26px;
    padding: 0;
    border: 0;
    background: transparent;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--muted);
    transition: color 0.4s ease;
  }

  .seg.is-active {
    color: #04211c;
  }

  /* ---------- 主读数 ---------- */
  main {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
  }

  .signal {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    max-width: 100%;
    padding: 6px 14px;
    border: 1px solid transparent;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 600;
    line-height: 1.4;
    transition: background-color 0.5s ease, border-color 0.5s ease, color 0.5s ease;
  }

  .signal[hidden] {
    display: none;
  }

  .signal.good {
    color: var(--good-fg);
    background-color: var(--good-bg);
    border-color: var(--good-edge);
  }

  .signal.fair {
    color: var(--fair-fg);
    background-color: var(--fair-bg);
    border-color: var(--fair-edge);
  }

  .signal.weak {
    color: var(--weak-fg);
    background-color: var(--weak-bg);
    border-color: var(--weak-edge);
  }

  .readout {
    --val-size: clamp(86px, 31vw, 230px);
    display: flex;
    align-items: baseline;
    justify-content: center;
    max-width: 100%;
    line-height: 1;
  }

  .value {
    flex: none;
    font-family: "DIN Alternate", "DIN Condensed", "SF Pro Display", -apple-system,
      BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Arial, sans-serif;
    font-size: var(--val-size);
    font-weight: 700;
    line-height: 0.86;
    letter-spacing: -0.045em;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
    background-image: linear-gradient(180deg, var(--num-top) 0%, var(--num-bottom) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    transition: opacity 0.3s ease, font-size 0.35s ease,
      --num-top 0.9s ease, --num-bottom 0.9s ease;
  }

  body[data-state="loading"] .value,
  body[data-state="error"] .value {
    opacity: 0.45;
  }

  .unit {
    font-family: "DIN Alternate", "SF Pro Display", -apple-system, BlinkMacSystemFont,
      "Helvetica Neue", Arial, sans-serif;
    font-size: calc(var(--val-size) * 0.17);
    font-weight: 700;
    color: var(--muted);
    transform: translateX(0.08em);
    transition: opacity 0.25s ease, color 0.6s ease, font-size 0.35s ease;
  }

  .unit.is-hidden {
    opacity: 0;
  }

  .accuracy {
    margin: 0;
    min-height: 1.3em;
    font-size: 13px;
    line-height: 1.3;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
    transition: color 0.6s ease, opacity 0.3s ease;
  }

  .status {
    margin: 0;
    max-width: 21em;
    min-height: 3em;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    line-height: 1.55;
    color: var(--muted);
    transition: color 0.5s ease;
  }

  body[data-state="error"] .status {
    color: var(--error-fg);
  }
  body[data-state="warn"] .status {
    color: var(--warn-fg);
  }

  /* ---------- 底部 ---------- */
  .bottom {
    flex: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .records {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .record {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 9px 10px;
    border: 1px solid var(--edge);
    border-radius: 14px;
    background-color: var(--surface);
    text-align: center;
    transition: background-color 0.6s ease, border-color 0.6s ease;
  }

  .record-label {
    font-size: 10.5px;
    letter-spacing: 0.04em;
    color: var(--muted);
    transition: color 0.6s ease;
  }

  .record-value {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.25;
    font-variant-numeric: tabular-nums;
    transition: color 0.6s ease, opacity 0.3s ease;
  }

  .actions {
    display: flex;
    gap: 10px;
  }

  button {
    font-family: inherit;
    border: 0;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
  }

  .primary {
    position: relative;
    flex: 1;
    padding: 17px 20px;
    border: 1px solid rgba(255, 255, 255, 0.28);
    border-radius: 20px;
    font-size: 16.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: #04211c;
    background-image:
      linear-gradient(180deg, rgba(255, 255, 255, 0.55) 0%, rgba(255, 255, 255, 0) 42%),
      linear-gradient(180deg, #7ff0dd 0%, #45dcc2 55%, #2bc2a8 100%);
    box-shadow:
      0 16px 34px -14px rgba(45, 212, 191, 0.7),
      0 2px 6px rgba(3, 10, 12, 0.18),
      inset 0 1px 0 rgba(255, 255, 255, 0.55);
    transition: transform 0.16s ease, opacity 0.2s ease, filter 0.2s ease,
      box-shadow 0.2s ease;
  }

  .ghost {
    flex: none;
    padding: 0 15px;
    border-radius: 20px;
    border: 1px solid var(--edge);
    background-color: var(--surface);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--muted);
    transition: transform 0.16s ease, background-color 0.4s ease, color 0.4s ease,
      border-color 0.4s ease, opacity 0.2s ease;
  }

  .primary:active {
    transform: scale(0.975);
    box-shadow:
      0 8px 18px -10px rgba(45, 212, 191, 0.7),
      inset 0 1px 0 rgba(255, 255, 255, 0.45);
  }

  .ghost:active {
    transform: scale(0.96);
  }

  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .primary:disabled {
    opacity: 0.55;
    filter: saturate(0.5);
    cursor: default;
    transform: none;
  }

  .geo {
    margin: 0;
    min-height: 1.2em;
    padding-top: 2px;
    text-align: center;
    font-size: 11.5px;
    letter-spacing: 0.04em;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: color 0.6s ease, opacity 0.3s ease;
  }

  /* ---------- 矮屏适配 ---------- */
  @media (max-height: 700px) {
    body {
      gap: 8px;
      padding-top: calc(env(safe-area-inset-top) + 12px);
      padding-bottom: calc(env(safe-area-inset-bottom) + 12px);
    }
    .readout {
      --val-size: clamp(74px, 26vw, 190px);
    }
    .status {
      min-height: 1.6em;
      font-size: 13px;
    }
    .record {
      padding: 7px 10px;
    }
    .primary {
      padding: 15px 20px;
    }
  }

  /* ---------- 无障碍：减少动效 ---------- */
  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body data-state="idle" data-zone="sea">

  <header class="topbar">
    <div class="brand-wrap">
      <span class="dot" aria-hidden="true"></span>
      <span class="brand">Altitude</span>
    </div>
    <div class="segmented" id="unitToggle" data-active="m" role="group" aria-label="海拔单位">
      <span class="seg-thumb" aria-hidden="true"></span>
      <button type="button" class="seg is-active" data-unit="m" aria-pressed="true" aria-label="米">m</button>
      <button type="button" class="seg" data-unit="ft" aria-pressed="false" aria-label="英尺">ft</button>
    </div>
  </header>

  <main>
    <div class="signal" id="signal" role="status" aria-live="polite" hidden></div>

    <div class="readout" id="readout" aria-hidden="true">
      <span class="value" id="value">--</span>
      <span class="unit is-hidden" id="unit">m</span>
    </div>

    <p class="accuracy" id="accuracy"></p>
    <p class="status" id="status" role="status" aria-live="polite">点击下方按钮，开始测量当前海拔</p>
  </main>

  <div class="bottom">
    <div class="records">
      <div class="record">
        <span class="record-label">本次最高</span>
        <span class="record-value" id="recordMax">--</span>
      </div>
      <div class="record">
        <span class="record-label">本次最低</span>
        <span class="record-value" id="recordMin">--</span>
      </div>
    </div>
    <div class="actions">
      <button class="ghost" id="reset" type="button">重置记录</button>
      <button class="primary" id="refresh" type="button">刷新海拔</button>
    </div>
    <p class="geo" id="geo"></p>
  </div>

  <noscript>
    <p style="position:fixed;inset:0;margin:0;display:grid;place-items:center;background:#0f172a;color:#f4f7fa;font-size:16px;">
      需要启用 JavaScript 才能使用海拔工具。
    </p>
  </noscript>

<script>
(function () {
  'use strict';

  var FT_PER_M = 3.28084;
  var STORE_KEY = 'altitudeTool.v1';
  var BUTTON_TEXT = '刷新海拔';
  var COUNT_DURATION = 520;

  // Geolocation 错误码：1 权限拒绝 / 2 位置不可用 / 3 超时
  var ERROR_MESSAGES = {
    1: '定位权限被拒绝。请到浏览器或系统设置中允许访问位置，然后重试。',
    2: '暂时无法获取位置信息，请检查网络或定位服务是否已开启。',
    3: '定位超时了，请到室外开阔处再试一次。'
  };

  // 海拔配色区间（上限不含）
  var ZONES = [
    { limit: 500, name: 'sea', color: '#0f172a' },
    { limit: 1500, name: 'forest', color: '#064e3b' },
    { limit: 3000, name: 'rock', color: '#334155' },
    { limit: Infinity, name: 'snow', color: '#e2e8f0' }
  ];

  var body = document.body;
  var readoutEl = document.getElementById('readout');
  var valueEl = document.getElementById('value');
  var unitEl = document.getElementById('unit');
  var signalEl = document.getElementById('signal');
  var accuracyEl = document.getElementById('accuracy');
  var statusEl = document.getElementById('status');
  var geoEl = document.getElementById('geo');
  var recordMaxEl = document.getElementById('recordMax');
  var recordMinEl = document.getElementById('recordMin');
  var refreshBtn = document.getElementById('refresh');
  var resetBtn = document.getElementById('reset');
  var unitToggle = document.getElementById('unitToggle');
  var themeMeta = document.querySelector('meta[name="theme-color"]');
  var segBtns = Array.prototype.slice.call(unitToggle.querySelectorAll('.seg'));

  var busy = false;

  // 海拔与精度统一以米为单位存储，显示时再按单位换算
  var state = {
    unit: 'm',
    status: 'idle',   // idle | loading | ok | warn | error
    altitude: null,
    accuracy: null,
    max: null,
    min: null,
    lat: null,
    lon: null
  };

  // 数字滚动动画：shown 记录当前屏幕上显示的数字（当前单位）
  var counter = {
    raf: null,
    shown: null
  };

  /* ---------- 本地存储 ---------- */
  function loadStore() {
    try {
      var raw = window.localStorage.getItem(STORE_KEY);
      if (!raw) {
        return;
      }
      var data = JSON.parse(raw);
      if (!data || typeof data !== 'object') {
        return;
      }
      if (data.unit === 'ft' || data.unit === 'm') {
        state.unit = data.unit;
      }
      if (typeof data.max === 'number' && isFinite(data.max)) {
        state.max = data.max;
      }
      if (typeof data.min === 'number' && isFinite(data.min)) {
        state.min = data.min;
      }
    } catch (err) {
      // 隐私模式下 localStorage 可能不可用，忽略即可
    }
  }

  function saveStore() {
    try {
      window.localStorage.setItem(STORE_KEY, JSON.stringify({
        unit: state.unit,
        max: state.max,
        min: state.min
      }));
    } catch (err) {
      // 写入失败时仅本次会话生效
    }
  }

  /* ---------- 格式化 ---------- */
  function convert(meters) {
    return state.unit === 'ft' ? meters * FT_PER_M : meters;
  }

  function unitSymbol() {
    return state.unit === 'ft' ? 'ft' : 'm';
  }

  function formatAltitude(meters) {
    if (meters === null || typeof meters !== 'number' || isNaN(meters)) {
      return '--';
    }
    return convert(meters).toFixed(1);
  }

  function formatAccuracy(meters) {
    if (meters === null || typeof meters !== 'number' || isNaN(meters)) {
      return '';
    }
    if (state.unit === 'ft') {
      return '误差 ±' + (meters * FT_PER_M).toFixed(1) + ' 英尺';
    }
    return '误差 ±' + Math.round(meters) + ' 米';
  }

  function formatCoords(lat, lon) {
    if (lat === null || lon === null) {
      return '';
    }
    var ns = lat >= 0 ? 'N' : 'S';
    var ew = lon >= 0 ? 'E' : 'W';
    return Math.abs(lat).toFixed(4) + '° ' + ns + ', ' + Math.abs(lon).toFixed(4) + '° ' + ew;
  }

  /* ---------- 背景配色 ---------- */
  function zoneFor(meters) {
    for (var i = 0; i < ZONES.length; i++) {
      if (meters < ZONES[i].limit) {
        return ZONES[i];
      }
    }
    return ZONES[ZONES.length - 1];
  }

  function applyZone(zone) {
    if (body.dataset.zone === zone.name) {
      return;
    }
    body.dataset.zone = zone.name;
    if (themeMeta) {
      themeMeta.setAttribute('content', zone.color);
    }
  }

  /* ---------- 自适应字号：保证长数字不溢出 ---------- */
  function fitValue() {
    var avail = document.querySelector('main').clientWidth;
    if (!avail) {
      return;
    }
    readoutEl.style.removeProperty('--val-size');
    var base = parseFloat(window.getComputedStyle(valueEl).fontSize);
    var natural = valueEl.scrollWidth + unitEl.offsetWidth + 6;
    if (natural > avail && natural > 0) {
      base = Math.floor(base * avail / natural * 0.97);
    }
    readoutEl.style.setProperty('--val-size', Math.max(40, base) + 'px');
  }

  /* ---------- 数字滚动 ---------- */
  function prefersReducedMotion() {
    return !!(window.matchMedia &&
      window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }

  function stopCounter() {
    if (counter.raf !== null) {
      window.cancelAnimationFrame(counter.raf);
      counter.raf = null;
    }
  }

  function setNumber(num) {
    valueEl.textContent = num.toFixed(1);
    counter.shown = num;
  }

  function animateNumber(fromNum, toNum) {
    stopCounter();

    var from = (typeof fromNum === 'number' && isFinite(fromNum)) ? fromNum : 0;

    if (prefersReducedMotion() || Math.abs(toNum - from) < 0.05) {
      setNumber(toNum);
      fitValue();
      return;
    }

    // 先按两者中较长的字符串确定字号，避免滚动过程中字号抖动
    var fromText = from.toFixed(1);
    var toText = toNum.toFixed(1);
    valueEl.textContent = fromText.length >= toText.length ? fromText : toText;
    fitValue();

    // 定好字号后立即回到起始值，避免探针文本闪一帧
    setNumber(from);

    var span = toNum - from;
    var startTime = null;

    function frame(now) {
      var time = typeof now === 'number' ? now : Date.now();
      if (startTime === null) {
        startTime = time;
      }
      var progress = Math.min(1, (time - startTime) / COUNT_DURATION);
      var eased = 1 - Math.pow(1 - progress, 3); // easeOutCubic

      setNumber(from + span * eased);

      if (progress < 1) {
        counter.raf = window.requestAnimationFrame(frame);
      } else {
        counter.raf = null;
        setNumber(toNum);
        fitValue();
      }
    }

    counter.raf = window.requestAnimationFrame(frame);
  }

  /* ---------- 渲染 ---------- */
  function renderValue(mode) {
    var hasAltitude = state.status === 'ok' && state.altitude !== null;

    if (!hasAltitude) {
      stopCounter();
      valueEl.textContent = '--';
      unitEl.textContent = unitSymbol();
      unitEl.classList.add('is-hidden');
      if (state.status === 'error') {
        counter.shown = null;
      }
      fitValue();
      return;
    }

    var target = convert(state.altitude);
    unitEl.textContent = unitSymbol();
    unitEl.classList.remove('is-hidden');

    if (mode === 'count' || mode === 'unit') {
      animateNumber(counter.shown, target);
    } else {
      stopCounter();
      setNumber(target);
      fitValue();
    }
  }

  function renderAccuracy() {
    var hasAltitude = state.status === 'ok' && state.altitude !== null;
    accuracyEl.textContent = hasAltitude ? formatAccuracy(state.accuracy) : '';
  }

  function renderSignal() {
    var accuracy = state.accuracy;
    var hasAltitude = state.status === 'ok' && state.altitude !== null;

    signalEl.classList.remove('good', 'fair', 'weak');

    if (!hasAltitude || accuracy === null) {
      signalEl.hidden = true;
      signalEl.textContent = '';
      return;
    }

    signalEl.hidden = false;

    if (accuracy > 50) {
      signalEl.classList.add('weak');
      signalEl.textContent = '⚠️ 信号较弱，当前为粗略海拔，请移至开阔地带';
    } else if (accuracy > 10) {
      signalEl.classList.add('fair');
      signalEl.textContent = '信号一般';
    } else {
      signalEl.classList.add('good');
      signalEl.textContent = '信号良好';
    }
  }

  function renderRecords() {
    var symbol = unitSymbol();
    recordMaxEl.textContent = state.max === null ? '--' : formatAltitude(state.max) + ' ' + symbol;
    recordMinEl.textContent = state.min === null ? '--' : formatAltitude(state.min) + ' ' + symbol;
  }

  function renderCoords() {
    geoEl.textContent = formatCoords(state.lat, state.lon);
  }

  function renderUnitToggle() {
    unitToggle.dataset.active = state.unit;
    segBtns.forEach(function (btn) {
      var active = btn.dataset.unit === state.unit;
      btn.classList.toggle('is-active', active);
      btn.setAttribute('aria-pressed', active ? 'true' : 'false');
    });
    unitEl.textContent = unitSymbol();
  }

  function renderAll(mode) {
    renderUnitToggle();
    renderValue(mode);
    renderAccuracy();
    renderSignal();
    renderRecords();
    renderCoords();
  }

  function setStatus(stateName) {
    state.status = stateName;
    body.dataset.state = stateName;
  }

  /* ---------- 业务 ---------- */
  function updateRecords(altitude) {
    if (state.max === null || altitude > state.max) {
      state.max = altitude;
    }
    if (state.min === null || altitude < state.min) {
      state.min = altitude;
    }
    saveStore();
  }

  function showError(message) {
    busy = false;
    refreshBtn.disabled = false;
    refreshBtn.textContent = BUTTON_TEXT;
    state.altitude = null;
    state.accuracy = null;
    state.lat = null;
    state.lon = null;
    setStatus('error');
    applyZone(ZONES[0]);
    statusEl.textContent = message;
    renderAll(false);
  }

  function showSuccess(position) {
    var coords = position.coords;
    var accuracy = typeof coords.accuracy === 'number' && isFinite(coords.accuracy)
      ? coords.accuracy
      : null;
    var altitude = typeof coords.altitude === 'number' && isFinite(coords.altitude)
      ? coords.altitude
      : null;

    busy = false;
    refreshBtn.disabled = false;
    refreshBtn.textContent = BUTTON_TEXT;

    state.accuracy = accuracy;
    state.altitude = altitude;
    state.lat = coords.latitude;
    state.lon = coords.longitude;

    if (altitude === null) {
      // 部分设备（尤其是未开启 GPS 的机型）不会返回垂直方向数据
      setStatus('warn');
      applyZone(ZONES[0]);
      statusEl.textContent = '已定位成功，但当前设备未能提供海拔数据，可在室外开阔处重试。';
    } else {
      setStatus('ok');
      applyZone(zoneFor(altitude));
      statusEl.textContent = '当前海拔';
      updateRecords(altitude);
    }

    renderAll('count');
  }

  function locate() {
    if (busy) {
      return;
    }

    if (!('geolocation' in navigator)) {
      showError('当前浏览器不支持定位功能，请更换浏览器后重试。');
      return;
    }

    busy = true;
    refreshBtn.disabled = true;
    refreshBtn.textContent = '定位中…';
    setStatus('loading');
    statusEl.textContent = '正在定位...';
    renderAll(false);

    navigator.geolocation.getCurrentPosition(
      showSuccess,
      function (error) {
        showError(ERROR_MESSAGES[error.code] || '获取位置失败，请稍后重试。');
      },
      {
        enableHighAccuracy: true,
        timeout: 20000,
        maximumAge: 0
      }
    );
  }

  function setUnit(unit) {
    if (state.unit === unit) {
      return;
    }
    state.unit = unit;
    saveStore();
    renderAll(state.status === 'ok' ? 'unit' : false);
  }

  function resetRecords() {
    state.max = null;
    state.min = null;
    saveStore();
    renderRecords();

    // 旧版浏览器没有 Web Animations API，跳过淡入即可
    if (typeof recordMaxEl.animate === 'function') {
      recordMaxEl.animate(
        [{ opacity: 0.2 }, { opacity: 1 }],
        { duration: 260, easing: 'ease-out' }
      );
      recordMinEl.animate(
        [{ opacity: 0.2 }, { opacity: 1 }],
        { duration: 260, easing: 'ease-out' }
      );
    }
  }

  /* ---------- 事件绑定 ---------- */
  refreshBtn.addEventListener('click', locate);
  resetBtn.addEventListener('click', resetRecords);

  segBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      setUnit(btn.dataset.unit);
    });
  });

  window.addEventListener('resize', function () {
    fitValue();
  });

  window.addEventListener('orientationchange', function () {
    window.setTimeout(fitValue, 120);
  });

  /* ---------- 初始化 ---------- */
  loadStore();
  renderAll(false);
})();
</script>
</body>
</html>
